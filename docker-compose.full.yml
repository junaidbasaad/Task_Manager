services:
  postgres:
    image: postgres:16-alpine
    container_name: team-task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamtaskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamtaskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: team-task-manager-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # In-container Postgres hostname (overrides localhost from .env)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teamtaskmanager?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: team-task-manager-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
