# =============================================================================
# Web service (frontend) — required Railway dashboard settings:
#   Settings → Source → Root Directory:  frontend
#   Settings → Config → Config file path: /frontend/railway.toml
#   Service name: web (so API_UPSTREAM can use ${{api.RAILWAY_PRIVATE_DOMAIN}})
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["frontend/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
