# Railway service: set Root Directory = backend in the dashboard
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Optional: add a Volume in Railway UI mounted at /app/uploads for persistent profile images
