# API service — Root Directory: backend | Config path: (empty = auto-detect this file)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Start + migrate: handled by Dockerfile CMD (do not set startCommand here)
