# =============================================================================
# API service — use ONLY when Root Directory is EMPTY (repo root).
# Config file path in Railway: railway.api.toml
#
# DO NOT use this file if Root Directory = backend
#   → use /backend/railway.toml instead (builds with backend/Dockerfile)
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
preDeployCommand = ["npx prisma migrate deploy"]
