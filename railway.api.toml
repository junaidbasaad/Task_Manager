# Use this ONLY for the API service when Root Directory cannot be set yet.
# Railway → api service → Settings → Config file path: /railway.api.toml
#
# PREFERRED (cleaner): Root Directory = backend, Config file path = /backend/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
startCommand = "npm start"
preDeployCommand = ["npx prisma migrate deploy"]
