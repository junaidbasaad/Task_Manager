# API service — Railway does NOT auto-detect this filename.
# Set in dashboard: Settings → Config → Config file path → railway.api.toml
# (or /railway.api.toml)
#
# Use with repo root as Source (Root Directory empty) OR alongside Root Directory = backend.
# Builds via Dockerfile.api from monorepo root (see dockerfilePath below).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
preDeployCommand = ["npx prisma migrate deploy"]
